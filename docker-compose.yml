services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    networks: [my-network]

  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes: [chroma_data:/data]
    ports: ["8000:8000"]
    networks: [my-network]

  minio:
    image: elestio/minio:latest   # later: pin to a specific tag
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: [minio_data:/data]
    ports: ["9000:9000", "9001:9001"]
    networks: [my-network]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on: [redis, chroma, minio]
    ports: ["8080:8080"]
    networks: [my-network]

volumes:
  redis_data:
  chroma_data:
  minio_data:

networks:
  my-network:
    driver: bridge